# infra/docker-compose.yml
services:
  quickgo-postgres:
    image: postgres:16-alpine
    container_name: postgres-quickgo
    env_file:
      - path: .env # Opcional: sobreescribe usuario/password/db
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickgo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quickgo}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
